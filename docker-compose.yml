services:
  easyocr-api:
    build:
      context: ./easyocr_api
      dockerfile: Dockerfile
      network: host  # Bypasses Fedora DNS resolution issues by using host network during build
    container_name: easyocr-api
    ports:
      - "8000:8000"
    environment:
      - USE_GPU=false
    volumes:
      - ./easyocr_api:/app
      # Cache EasyOCR models on the host to avoid redownloading them if container is rebuilt
      - easyocr-cache:/root/.EasyOCR
    restart: unless-stopped

volumes:
  easyocr-cache:
